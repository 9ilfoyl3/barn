appId: com.barn.desktop
productName: Barn
asar: true
directories:
  output: release
files:
  - out/**/*
  - resources/**/*
  - package.json
mac:
  category: public.app-category.business
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
