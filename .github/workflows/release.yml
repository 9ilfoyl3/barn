name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: package:mac
            artifact: barn-macos
          - os: windows-latest
            command: package:win
            artifact: barn-windows
    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --registry=https://registry.npmjs.org --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm lint
      - run: pnpm security:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm ${{ matrix.command }}
      - name: Locate packaged executable
        shell: bash
        run: echo "BARN_PACKAGED_EXECUTABLE=$(find release -type f \( -name Barn -o -name Barn.exe \) | head -n 1)" >> "$GITHUB_ENV"
      - run: pnpm exec playwright test tests/e2e/packaged.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
