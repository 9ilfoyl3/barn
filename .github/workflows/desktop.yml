name: Desktop

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: package:mac:dir
          - os: windows-latest
            package: package:win:dir
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --registry=https://registry.npmjs.org --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm lint
      - run: pnpm security:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm ${{ matrix.package }}
      - name: Locate packaged executable
        shell: bash
        run: echo "BARN_PACKAGED_EXECUTABLE=$(find release -type f \( -name Barn -o -name Barn.exe \) | head -n 1)" >> "$GITHUB_ENV"
      - run: pnpm exec playwright test tests/e2e/packaged.spec.ts
